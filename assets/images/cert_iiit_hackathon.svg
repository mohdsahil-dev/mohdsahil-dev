<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="iiitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c43" />
      <stop offset="50%" stop-color="#053f5e" />
      <stop offset="100%" stop-color="#011627" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#iiitBg)" rx="12" />
  
  <!-- Outer Blue/Cyan Border -->
  <rect x="18" y="18" width="564" height="364" rx="8" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" stroke-dasharray="6 4" />
  <rect x="25" y="25" width="550" height="350" rx="6" fill="#0f172a" opacity="0.95" stroke="#1e293b" stroke-width="1" />

  <!-- Top Badges -->
  <g transform="translate(45, 45)">
    <!-- Unstop representation -->
    <rect x="0" y="0" width="80" height="24" rx="6" fill="#0284c7" />
    <text x="40" y="16" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="11" text-anchor="middle">unstop</text>
    <rect x="360" y="0" width="140" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="430" y="16" fill="#7dd3fc" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">IIIT Allahabad • OOSC</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="300" y="125" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="20" text-anchor="middle" letter-spacing="2">CERTIFICATE OF PARTICIPATION</text>
  <text x="300" y="150" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">OOSC 4.0 HACKATHON</text>

  <!-- Divider -->
  <line x1="180" y1="170" x2="420" y2="170" stroke="#0284c7" stroke-width="2" />

  <!-- Recipient Name -->
  <text x="300" y="215" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="24" text-anchor="middle">Mohd Sahil</text>
  <text x="300" y="245" fill="#cbd5e1" font-family="sans-serif" font-size="11.5" text-anchor="middle">Team: Logical Innovators • Theem College of Engg.</text>
  <text x="300" y="265" fill="#94a3b8" font-family="sans-serif" font-size="10.5" text-anchor="middle">Opportunity Open Source Conference (OOSC) 4.0</text>

  <!-- Footer Info -->
  <g transform="translate(45, 330)">
    <text x="0" y="0" fill="#64748b" font-family="monospace" font-size="10">Organized by IIIT Allahabad</text>
    <rect x="360" y="-18" width="140" height="28" rx="6" fill="url(#blueGrad)" />
    <text x="430" y="1" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="11" text-anchor="middle">OOSC 4.0 Hackathon 🏆</text>
  </g>
</svg>
