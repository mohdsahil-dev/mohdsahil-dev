<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="isroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="50%" stop-color="#1c2541" />
      <stop offset="100%" stop-color="#0b0c10" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#isroBg)" rx="12" />
  
  <!-- Outer Gold/Orange Border -->
  <rect x="18" y="18" width="564" height="364" rx="8" fill="none" stroke="#f97316" stroke-width="1.5" opacity="0.6" stroke-dasharray="6 4" />
  <rect x="25" y="25" width="550" height="350" rx="6" fill="#111827" opacity="0.95" stroke="#374151" stroke-width="1" />

  <!-- Top Badges -->
  <g transform="translate(45, 45)">
    <!-- ISRO Logo representation -->
    <text x="0" y="20" fill="#f97316" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="18" letter-spacing="1">इसरो | isro</text>
    <rect x="360" y="2" width="140" height="24" rx="12" fill="#1f2937" stroke="#4b5563" stroke-width="1" />
    <text x="430" y="18" fill="#9ca3af" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">Powered by Hack2skill</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="300" y="125" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="20" text-anchor="middle" letter-spacing="2">CERTIFICATE OF PARTICIPATION</text>
  <text x="300" y="150" fill="#9ca3af" font-family="sans-serif" font-size="11" text-anchor="middle">BHARATIYA ANTARIKSH HACKATHON 2026</text>

  <!-- Divider -->
  <line x1="180" y1="170" x2="420" y2="170" stroke="#f97316" stroke-width="2" />

  <!-- Recipient Name -->
  <text x="300" y="215" fill="#f97316" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="24" text-anchor="middle">Mohd Sahil Mohd Swaleh</text>
  <text x="300" y="245" fill="#cbd5e1" font-family="sans-serif" font-size="11.5" text-anchor="middle">In recognition of participation and successful idea submission</text>
  <text x="300" y="265" fill="#94a3b8" font-family="sans-serif" font-size="10.5" text-anchor="middle">Presented by Indian Space Research Organisation (ISRO)</text>

  <!-- Footer Info -->
  <g transform="translate(45, 330)">
    <text x="0" y="0" fill="#64748b" font-family="monospace" font-size="10">ID: 2026H2S06BAH-P17212</text>
    <rect x="360" y="-18" width="140" height="28" rx="6" fill="url(#orangeGrad)" />
    <text x="430" y="1" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="11" text-anchor="middle">ISRO Hackathon 🚀</text>
  </g>
</svg>
