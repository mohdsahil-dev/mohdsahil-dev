<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="univoraBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="univoraGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#univoraBg)" />
  
  <!-- Subtle Grid Lines -->
  <g opacity="0.12" stroke="#60a5fa" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="225" x2="800" y2="225" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="375" x2="800" y2="375" />
    <line x1="100" y1="0" x2="100" y2="450" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="300" y1="0" x2="300" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="500" y1="0" x2="500" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
    <line x1="700" y1="0" x2="700" y2="450" />
  </g>

  <!-- Main Window Mockup -->
  <g transform="translate(60, 40)">
    <!-- Browser/App Frame -->
    <rect width="680" height="370" rx="12" fill="#111827" stroke="#334155" stroke-width="2" />
    
    <!-- Top Bar -->
    <path d="M 0 12 Q 0 0 12 0 L 668 0 Q 680 0 680 12 L 680 42 L 0 42 Z" fill="#1f2937" />
    <circle cx="22" cy="21" r="5" fill="#ef4444" />
    <circle cx="38" cy="21" r="5" fill="#f59e0b" />
    <circle cx="54" cy="21" r="5" fill="#10b981" />
    
    <!-- App Logo / Title in Header -->
    <text x="75" y="26" fill="#93c5fd" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="13" letter-spacing="0.5">UNIVORA • College Portal</text>
    <rect x="520" y="10" width="140" height="22" rx="6" fill="#374151" />
    <text x="545" y="25" fill="#9ca3af" font-family="sans-serif" font-size="10">🔍 Search portal...</text>

    <!-- Sidebar -->
    <rect x="0" y="42" width="150" height="328" fill="#161e2e" />
    
    <!-- Sidebar Items -->
    <rect x="12" y="60" width="126" height="28" rx="6" fill="url(#univoraGrad)" />
    <text x="26" y="78" fill="#ffffff" font-family="sans-serif" font-weight="600" font-size="11">📊 Dashboard</text>
    
    <text x="26" y="116" fill="#94a3b8" font-family="sans-serif" font-size="11">🎓 Students (2.4k)</text>
    <text x="26" y="152" fill="#94a3b8" font-family="sans-serif" font-size="11">📚 Courses</text>
    <text x="26" y="188" fill="#94a3b8" font-family="sans-serif" font-size="11">👨‍🏫 Faculty</text>
    <text x="26" y="224" fill="#94a3b8" font-family="sans-serif" font-size="11">📅 Schedules</text>
    <text x="26" y="260" fill="#94a3b8" font-family="sans-serif" font-size="11">💳 Fee Records</text>

    <!-- Main Content Area -->
    <!-- Metric Card 1 -->
    <rect x="170" y="60" width="150" height="74" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <text x="185" y="82" fill="#94a3b8" font-family="sans-serif" font-size="10">Total Enrolled</text>
    <text x="185" y="112" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="20">3,420</text>
    <text x="260" y="110" fill="#10b981" font-family="sans-serif" font-size="10">+12.5%</text>

    <!-- Metric Card 2 -->
    <rect x="335" y="60" width="150" height="74" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <text x="350" y="82" fill="#94a3b8" font-family="sans-serif" font-size="10">Active Courses</text>
    <text x="350" y="112" fill="#38bdf8" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="20">48 Depts</text>

    <!-- Metric Card 3 -->
    <rect x="500" y="60" width="160" height="74" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <text x="515" y="82" fill="#94a3b8" font-family="sans-serif" font-size="10">Attendance Rate</text>
    <text x="515" y="112" fill="#a78bfa" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="20">94.8%</text>

    <!-- Attendance Chart Mockup -->
    <rect x="170" y="150" width="315" height="195" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <text x="188" y="174" fill="#f8fafc" font-family="sans-serif" font-weight="600" font-size="12">Campus Attendance Trends</text>
    
    <!-- Graph Lines -->
    <path d="M 190 300 Q 240 250 280 270 T 360 210 T 430 230 T 465 190" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <path d="M 190 300 Q 240 250 280 270 T 360 210 T 430 230 T 465 190 L 465 320 L 190 320 Z" fill="url(#univoraGrad)" opacity="0.15" />
    
    <!-- Schedule / Notice Card -->
    <rect x="500" y="150" width="160" height="195" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <text x="515" y="174" fill="#f8fafc" font-family="sans-serif" font-weight="600" font-size="12">Recent Notices</text>
    
    <rect x="512" y="190" width="136" height="36" rx="4" fill="#1e293b" />
    <text x="520" y="206" fill="#e2e8f0" font-family="sans-serif" font-size="9" font-weight="600">Mid-Sem Exams</text>
    <text x="520" y="218" fill="#64748b" font-family="sans-serif" font-size="8">Oct 14 • Schedule released</text>

    <rect x="512" y="235" width="136" height="36" rx="4" fill="#1e293b" />
    <text x="520" y="251" fill="#e2e8f0" font-family="sans-serif" font-size="9" font-weight="600">AI Hackathon '26</text>
    <text x="520" y="263" fill="#64748b" font-family="sans-serif" font-size="8">Registration Open</text>
  </g>
</svg>
